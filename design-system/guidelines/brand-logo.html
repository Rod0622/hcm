<!-- @dsCard group="Brand" viewport="700x190" name="Logo" subtitle="Official knot mark + serif logotype · black on light/warm, white on dark · never recolor" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; height: 100vh; }
  .third { padding: 20px; display: flex; flex-direction: column; justify-content: center; gap: 16px; background: var(--bg-base); }
  .third .label { font: var(--label-caps); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3); }
</style>
</head>
<body>
  <div class="third">
    <span class="label">Light</span>
    <img src="../assets/logotype-black.png" alt="Tenkara" style="width: 150px;">
    <img src="../assets/logo-mark-black.png" alt="" style="width: 34px;">
  </div>
  <div class="third" data-theme="warm">
    <span class="label">Warm</span>
    <img src="../assets/logotype-black.png" alt="Tenkara" style="width: 150px;">
    <img src="../assets/logo-mark-black.png" alt="" style="width: 34px;">
  </div>
  <div class="third" data-theme="dark">
    <span class="label">Dark</span>
    <img src="../assets/logotype-white.png" alt="Tenkara" style="width: 150px;">
    <img src="../assets/logo-mark-white.png" alt="" style="width: 34px;">
  </div>
</body>
</html>
