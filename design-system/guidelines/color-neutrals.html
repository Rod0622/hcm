<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — warm stone" subtitle="--gray-0…950 · warm stone scale: borders, text and surfaces all come from it" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { display: flex; align-items: center; padding: 18px 20px; background: var(--bg-base); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; border-top: 1px solid var(--border-1); border-bottom: 1px solid var(--border-1); }
  .sw:first-child { border-left: 1px solid var(--border-1); border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .sw:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .sw span { font: var(--weight-medium) var(--text-2xs)/1.3 var(--font-mono); }
</style>
</head>
<body>
  <div class="sw" style="background: var(--gray-0)"><span style="color: var(--gray-500)">0</span></div>
  <div class="sw" style="background: var(--gray-50)"><span style="color: var(--gray-500)">50</span></div>
  <div class="sw" style="background: var(--gray-100)"><span style="color: var(--gray-600)">100</span></div>
  <div class="sw" style="background: var(--gray-200)"><span style="color: var(--gray-600)">200</span></div>
  <div class="sw" style="background: var(--gray-300)"><span style="color: var(--gray-700)">300</span></div>
  <div class="sw" style="background: var(--gray-400)"><span style="color: #fff">400</span></div>
  <div class="sw" style="background: var(--gray-500)"><span style="color: #fff">500</span></div>
  <div class="sw" style="background: var(--gray-600)"><span style="color: #fff">600</span></div>
  <div class="sw" style="background: var(--gray-700)"><span style="color: #fff">700</span></div>
  <div class="sw" style="background: var(--gray-800)"><span style="color: #fff">800</span></div>
  <div class="sw" style="background: var(--gray-850)"><span style="color: #fff">850</span></div>
  <div class="sw" style="background: var(--gray-900)"><span style="color: #fff">900</span></div>
  <div class="sw" style="background: var(--gray-950)"><span style="color: #fff">950</span></div>
</body>
</html>
