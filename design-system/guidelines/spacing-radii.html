<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & shadows" subtitle="6/8/12/16px · whisper shadows in light, borders do the work in dark" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; background: var(--bg-base); display: flex; align-items: center; gap: 16px; }
  .box { width: 96px; height: 84px; background: var(--bg-surface); border: 1px solid var(--border-1); display: flex; align-items: flex-end; padding: 8px; }
  .box span { font: var(--weight-medium) var(--text-2xs)/1.3 var(--font-mono); color: var(--text-3); }
</style>
</head>
<body>
  <div class="box" style="border-radius: var(--radius-sm); box-shadow: var(--shadow-xs)"><span>sm 6<br>shadow-xs</span></div>
  <div class="box" style="border-radius: var(--radius-md); box-shadow: var(--shadow-sm)"><span>md 8<br>shadow-sm</span></div>
  <div class="box" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-md)"><span>lg 12<br>shadow-md</span></div>
  <div class="box" style="border-radius: var(--radius-xl); box-shadow: var(--shadow-lg)"><span>xl 16<br>shadow-lg</span></div>
  <div class="box" style="border-radius: var(--radius-full); width: 84px"><span style="padding-left: 14px">full<br>999</span></div>
</body>
</html>
