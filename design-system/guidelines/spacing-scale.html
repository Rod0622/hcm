<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px grid · gutters 32px · compact data rows 36–44px" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; background: var(--bg-base); display: flex; align-items: flex-end; gap: 14px; }
  .s { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .s i { display: block; background: var(--accent-subtle); border: 1px solid var(--accent-muted); border-radius: 2px; }
  .s span { font: var(--weight-medium) var(--text-2xs)/1 var(--font-mono); color: var(--text-3); }
</style>
</head>
<body>
  <div class="s"><i style="width: 4px; height: 4px"></i><span>1·4</span></div>
  <div class="s"><i style="width: 8px; height: 8px"></i><span>2·8</span></div>
  <div class="s"><i style="width: 12px; height: 12px"></i><span>3·12</span></div>
  <div class="s"><i style="width: 16px; height: 16px"></i><span>4·16</span></div>
  <div class="s"><i style="width: 20px; height: 20px"></i><span>5·20</span></div>
  <div class="s"><i style="width: 24px; height: 24px"></i><span>6·24</span></div>
  <div class="s"><i style="width: 32px; height: 32px"></i><span>8·32</span></div>
  <div class="s"><i style="width: 40px; height: 40px"></i><span>10·40</span></div>
  <div class="s"><i style="width: 48px; height: 48px"></i><span>12·48</span></div>
  <div class="s"><i style="width: 64px; height: 64px"></i><span>16·64</span></div>
  <div class="s"><i style="width: 80px; height: 80px"></i><span>20·80</span></div>
</body>
</html>
