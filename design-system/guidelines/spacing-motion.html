<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="120/180/280ms · cubic-bezier(0.2,0,0,1) · opacity + 4–6px translate, no bounces" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; background: var(--bg-base); display: flex; align-items: center; gap: 24px; }
  .demo { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .demo span { font: var(--weight-medium) var(--text-2xs)/1 var(--font-mono); color: var(--text-3); }
  .chip { width: 120px; height: 56px; border-radius: var(--radius-md); background: var(--bg-surface); border: 1px solid var(--border-1); box-shadow: var(--shadow-xs); display: flex; align-items: center; justify-content: center; font: var(--label-md); color: var(--text-1); }
  @media (prefers-reduced-motion: no-preference) {
    .a1 { animation: enter var(--duration-fast) var(--ease-out) infinite alternate; }
    .a2 { animation: enter var(--duration-base) var(--ease-out) infinite alternate; }
    .a3 { animation: pop var(--duration-slow) var(--ease-out) infinite alternate; }
  }
  @keyframes enter { from { opacity: 0.25; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0.25; transform: scale(0.98) translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="demo"><div class="chip a1">fast</div><span>120ms · hover, color</span></div>
  <div class="demo"><div class="chip a2">base</div><span>180ms · enter, fade</span></div>
  <div class="demo"><div class="chip a3">slow</div><span>280ms · dialogs 0.98→1</span></div>
  <p style="font: var(--body-sm); color: var(--text-2); max-width: 200px">No bounces. No spinners over 1s — use skeletons. Celebrate only payroll-grade completion.</p>
</body>
</html>
