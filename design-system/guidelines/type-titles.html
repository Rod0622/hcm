<!-- @dsCard group="Type" viewport="700x210" name="Display & titles" subtitle="Young Serif for display (matches the logotype) · Geist semibold for section/card titles" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; background: var(--bg-base); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { font: var(--weight-medium) var(--text-2xs)/1 var(--font-mono); color: var(--text-3); width: 170px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="row"><span class="meta">--title-display · serif 48</span><span style="font: var(--weight-regular) var(--text-4xl)/1.1 var(--font-serif); letter-spacing: var(--tracking-serif); color: var(--text-1)">Workforce operations</span></div>
  <div class="row"><span class="meta">--title-page · serif 26</span><span style="font: var(--title-page); letter-spacing: var(--tracking-serif); color: var(--text-1)">Payroll review center</span></div>
  <div class="row"><span class="meta">--title-section · 16/600</span><span style="font: var(--title-section); letter-spacing: var(--tracking-display); color: var(--text-1)">Current run · Mar 1–15</span></div>
  <div class="row"><span class="meta">--title-card · 14/600</span><span style="font: var(--title-card); color: var(--text-1)">Compliance alerts</span></div>
</body>
</html>
