<!-- @dsCard group="Colors" viewport="700x150" name="Brand accent — bronze gold" subtitle="--gold-100…800 · use sparingly: primary actions, selection, focus" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { display: flex; align-items: center; gap: 0; padding: 18px 20px; background: var(--bg-base); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .sw:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .sw:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .sw span { font: var(--weight-medium) var(--text-2xs)/1.3 var(--font-mono); }
  .core { outline: 2px solid var(--text-1); outline-offset: -2px; position: relative; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--gold-100)"><span style="color: var(--gold-800)">100</span></div>
  <div class="sw" style="background: var(--gold-200)"><span style="color: var(--gold-800)">200</span></div>
  <div class="sw" style="background: var(--gold-300)"><span style="color: var(--gold-800)">300</span></div>
  <div class="sw" style="background: var(--gold-400)"><span style="color: #fff">400</span></div>
  <div class="sw" style="background: var(--gold-500)"><span style="color: #fff">500</span></div>
  <div class="sw core" style="background: var(--gold-600)"><span style="color: #fff">600 · --accent</span></div>
  <div class="sw" style="background: var(--gold-700)"><span style="color: #fff">700</span></div>
  <div class="sw" style="background: var(--gold-800)"><span style="color: #fff">800</span></div>
</body>
</html>
